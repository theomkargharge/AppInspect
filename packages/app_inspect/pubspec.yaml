name: app_inspect
description: >-
  A QC-first network inspector for Flutter. See the API calls of each screen,
  copy them as cURL and share them, right inside the app.
version: 0.2.2
repository: https://github.com/theomkargharge/AppInspect/tree/main/packages/app_inspect
issue_tracker: https://github.com/theomkargharge/AppInspect/issues
topics:
  - network
  - debugging
  - http
  - logging
  - qa
screenshots:
  - description: The floating bubble counts this screen's API calls and turns red when one fails.
    path: screenshots/bubble.webp
  - description: Calls grouped by screen, with failed, slow and repeated calls flagged.
    path: screenshots/calls.webp
  - description: A parse error names the exact field the app couldn't read.
    path: screenshots/parse_error.webp
  - description: Copy any call as cURL. Tokens and passwords stay masked.
    path: screenshots/curl.webp
  - description: Share a call as Markdown, or export it as HAR or a Postman collection.
    path: screenshots/export.webp
  - description: Logs console with debugPrint, print, errors and failed calls, tagged by screen.
    path: screenshots/logs.webp
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
